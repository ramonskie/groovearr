services:
  slskd:
    image: slskd/slskd:latest
    container_name: groovearr-slskd
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_HTTP_PORT: "5030"
      SLSKD_HTTPS_DISABLED: "true"
      SLSKD_SLSK_LISTEN_PORT: "50301"
      SLSKD_SHARED_DIR: /downloads
      SLSKD_APP_DIR: /app
    volumes:
      - ./slskd.yml:/app/slskd.yml:Z
      - slskd-data:/app
      - soulseek-downloads:/downloads
      - music:/music
    ports:
      - "5030:5030"
      - "50301:50301"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: groovearr-prowlarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: groovearr-flaresolverr
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    ports:
      - "8191:8191"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: groovearr-qbittorrent
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads:rw
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  groovearr:
    build: .
    container_name: groovearr
    environment:
      GROOVEARR_CONFIG: /config/config.json
      GROOVEARR_ADDR: ":8008"
    volumes:
      - ./config.docker.json:/config/config.json:Z
      - qbittorrent-downloads:/downloads/qbittorrent
      - soulseek-downloads:/downloads/soulseek
      - music:/music
      - playlists:/playlists
    ports:
      - "8008:8008"
    restart: unless-stopped

volumes:
  slskd-data:
  prowlarr-config:
  qbittorrent-config:
  soulseek-downloads:
  qbittorrent-downloads:
  music:
  playlists:
